name: Build GPS Splitter Windows Prototype

on:
  push:
    branches:
      - gps-splitter-driver
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build GPS_Splitter.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial pynmea2
          New-Item -ItemType Directory -Force build_bundle\app | Out-Null
          pyinstaller --noconfirm --clean --onefile --windowed --name GPS_Splitter gps-splitter\app\GPS_Splitter.py
          Copy-Item dist\GPS_Splitter.exe build_bundle\app\GPS_Splitter.exe

      - name: Checkout Microsoft Windows driver samples
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          path: deps/windows-driver-samples
          submodules: recursive

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK NuGet packages
        shell: pwsh
        working-directory: deps/windows-driver-samples
        run: |
          nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Apply GPS driver customization
        shell: pwsh
        run: |
          Copy-Item gps-splitter\driver\virtualserial2um.inx deps\windows-driver-samples\serial\VirtualSerial2\ComPort\virtualserial2um.inx -Force
          .\gps-splitter\driver\patch_virtualserial.ps1

      - name: Build VirtualSerial2 with official sample build environment
        shell: pwsh
        working-directory: deps/windows-driver-samples
        run: |
          .\Build-Samples.ps1 -Samples 'serial.virtualserial2' -Configurations 'Release' -Platforms 'x64' -RunMode NuGet -ThrottleLimit 1

      - name: Build DevCon with official sample build environment
        shell: pwsh
        working-directory: deps/windows-driver-samples
        run: |
          .\Build-Samples.ps1 -Samples 'setup.devcon' -Configurations 'Release' -Platforms 'x64' -RunMode NuGet -ThrottleLimit 1

      - name: Collect test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_bundle\driver | Out-Null

          $dll = Get-ChildItem deps\windows-driver-samples\serial\VirtualSerial2 -Recurse -Filter VirtualSerial2um.dll | Select-Object -First 1
          $inf = Get-ChildItem deps\windows-driver-samples\serial\VirtualSerial2 -Recurse -Filter virtualserial2um.inf | Select-Object -First 1
          $cat = Get-ChildItem deps\windows-driver-samples\serial\VirtualSerial2 -Recurse -Filter WUDF.cat | Select-Object -First 1
          $devcon = Get-ChildItem deps\windows-driver-samples\setup\devcon -Recurse -Filter devcon.exe | Select-Object -First 1

          if (-not $dll) { throw "VirtualSerial2um.dll not found" }
          if (-not $inf) { throw "virtualserial2um.inf not found" }
          if (-not $devcon) { throw "devcon.exe not found" }

          Copy-Item $dll.FullName build_bundle\driver\VirtualSerial2um.dll
          Copy-Item $inf.FullName build_bundle\driver\virtualserial2um.inf
          if ($cat) { Copy-Item $cat.FullName build_bundle\driver\WUDF.cat }
          Copy-Item $devcon.FullName build_bundle\driver\devcon.exe

          Copy-Item gps-splitter\driver\install_test.cmd build_bundle\driver\install_test.cmd
          Copy-Item gps-splitter\driver\uninstall_test.cmd build_bundle\driver\uninstall_test.cmd
          Copy-Item gps-splitter\driver\enable_test_mode.cmd build_bundle\driver\enable_test_mode.cmd
          Copy-Item gps-splitter\driver\disable_test_mode.cmd build_bundle\driver\disable_test_mode.cmd

          $wdkCert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -like "CN=WDKTestCert*" } |
            Sort-Object NotBefore -Descending |
            Select-Object -First 1
          if (-not $wdkCert) { throw "WDKTestCert not found in CurrentUser certificate store" }
          Export-Certificate -Cert $wdkCert -FilePath build_bundle\driver\WDKTestCert.cer | Out-Null

          Copy-Item gps-splitter\README.md build_bundle\README.md

      - name: Create and apply test signing certificate
        continue-on-error: true
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=GPS Splitter Test Certificate" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256 -KeyLength 2048 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(2)
          Export-Certificate -Cert $cert -FilePath build_bundle\driver\GPSVCOM-Test.cer | Out-Null

          $passwordText = "GpsSplitterCiTestOnly-2026"
          $password = ConvertTo-SecureString -String $passwordText -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\gpsvcom-test.pfx" -Password $password | Out-Null

          $signtool = Get-ChildItem deps\windows-driver-samples\packages -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }

          & $signtool.FullName sign /as /fd SHA256 /f "$env:RUNNER_TEMP\gpsvcom-test.pfx" /p $passwordText build_bundle\driver\WUDF.cat
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed" }

          & $signtool.FullName verify /pa /v build_bundle\driver\WUDF.cat
          if ($LASTEXITCODE -ne 0) { Write-Warning "Primary WDK sample signature is not trusted on the CI runner; exported GPSVCOM-Test.cer is included for target-PC trust." }

          Remove-Item "$env:RUNNER_TEMP\gpsvcom-test.pfx" -Force

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Splitter-Windows-Prototype
          path: build_bundle
